[package]
name = "jiandu-core"
version = "1.47.0"
edition = "2021"
description = "笺读 · 纯逻辑核心（网格排版 / EPUB 解析 / 字典查询）——零 GPUI 依赖，可移植 iOS"
license = "MIT"
authors = ["you"]

[dependencies]
# 文本与结构
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# EPUB 导入（zip + opf 解析）
zip = "2"
# 编码探测：老书 txt 多为 GBK
encoding_rs = "0.8"
# 简繁对照表 / 惰性静态表
once_cell = "1"
# （PDF 导出已移除：v1.56.0，故 flate2 / image 不再需要）
# 离线双引擎字典：《康熙字典》+《說文解字》合并库（bundled = 自编译 sqlite3）
rusqlite = { version = "0.32.1", features = ["bundled"] }
# 跨平台标准应用数据目录：macOS → ~/Library/Application Support
# （App Sandbox 下系统透明重定向到容器，三态通用，避免硬编码 ~/.jiandu）
dirs = "5"
