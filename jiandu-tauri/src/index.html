<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>笺读 · 导入阅读</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!-- 顶部极简条：仅显示当前书名（已移除所有文字按钮，避免遮挡古籍阅读） -->
    <div class="topbar">
      <span id="file-name" class="file-name"></span>
    </div>

    <!-- 阅读区：宣纸背景、可滚动 -->
    <main id="reader" class="reader">
      <!-- 默认欢迎：古籍竖排测试页（未导入时显示） -->
      <div class="welcome" id="welcome">
        <div class="fold"></div>
        <div class="book">
          <div class="title">静夜思</div>
          <div class="verse">
            床前明月光<span class="dian">，</span>疑是地上霜<span class="dian">。</span>举头望明月<span class="dian">，</span>低头思故乡<span class="dian">。</span>
          </div>
          <div class="author">唐 · 李白</div>
        </div>
      </div>

      <!-- 导入后的书籍渲染区（JS 注入，hidden 初始隐藏） -->
      <div class="book-view" id="book-view" hidden></div>
    </main>

    <!-- 系统不支持引导页：老旧 Windows（如 Win7）触发，引导至「云端代排服务」 -->
    <div class="unsupported" id="unsupported" hidden>
      <div class="unsupported-card">
        <h1>系统版本过低</h1>
        <p id="unsupported-msg"></p>
        <button id="cloud-btn" type="button">前往「云端代排服务」</button>
        <p class="hint">Windows 10（1803 及以上）/ Windows 11 可正常安装使用。</p>
      </div>
    </div>
  <!-- 通用文件选择器（Android / 桌面都用这个）：读成字节交后端内存解析，绕开路径问题 -->
<input
  type="file"
  id="file-input"
  accept=".epub,.txt,.md,.markdown,.json,.docx,.html,.htm"
  hidden
/>

<!-- 右下角极简悬浮操作：导入 / 朗读 / 停止（圆形图标，半透明毛玻璃） -->
<div class="fab">
  <button id="tts-stop-btn" class="fab-item" type="button" title="停止朗读" aria-label="停止朗读">■</button>
  <button id="tts-btn" class="fab-item" type="button" title="朗读 / 暂停" aria-label="朗读">♪</button>
  <button id="import-btn" class="fab-item fab-import" type="button" title="导入书籍" aria-label="导入书籍">＋</button>
</div>
</body>
</html>
