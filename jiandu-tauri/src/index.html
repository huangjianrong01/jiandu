<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>笺读 · 导入阅读</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!-- 顶栏：导入按钮 + TTS 朗读控制 + 测试按钮 + 当前文件名 -->
    <div class="topbar">
      <button id="import-btn" type="button">导入书籍</button>
      <button id="tts-btn" type="button" class="tts-btn">朗读</button>
      <button id="tts-stop-btn" type="button" class="tts-btn">停止</button>
      <button id="test-core-btn" type="button">测试 core 大脑</button>
      <span id="file-name" class="file-name"></span>
    </div>

    <!-- 阅读区：宣纸背景、可滚动 -->
    <main id="reader" class="reader">
      <!-- 默认欢迎：古籍竖排测试页（未导入时显示） -->
      <div class="welcome" id="welcome">
        <div class="fold"></div>
        <div class="book">
          <div class="title">静夜思</div>
          <div class="verse">
            床前明月光<span class="dian">，</span>疑是地上霜<span class="dian">。</span>举头望明月<span class="dian">，</span>低头思故乡<span class="dian">。</span>
          </div>
          <div class="author">唐 · 李白</div>
        </div>
      </div>

      <!-- 导入后的书籍渲染区（JS 注入，hidden 初始隐藏） -->
      <div class="book-view" id="book-view" hidden></div>
    </main>
  </body>
</html>
