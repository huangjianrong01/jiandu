[package]
name = "jiandu-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jiandu_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 接入笺读纯 Rust 内核（crates/core）。路径相对 src-tauri/：
# src-tauri → jiandu-tauri → jiandu(仓库根) → crates/core
# 注意：依赖键名用 package 名「jiandu-core」（连字符），
# 代码里引用的是 lib 名「jiandu_core」（下划线，Cargo 自动转换）。
jiandu-core = { path = "../../crates/core" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 独立 workspace：本工程位于 jiandu 仓库内，但根 Cargo.toml 已是 workspace，
# 若此处不声明独立 [workspace]，cargo 会把本 crate 当成根 workspace 的未登记成员而报错。
# 后续若要接 jiandu-core，可在此用 path 依赖 ../crates/core。
[workspace]
