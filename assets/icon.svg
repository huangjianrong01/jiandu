<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 笺读 App icon · 左一款式原样保留，只做「鱼尾上下等距外移 + 删两鱼尾之间的粗中缝」
       画布 512×512，中线 y=256，中轴 x=256
       配色（左一原色）：米色纸 #F4ECD6 / 墨线 #2B2622 / 沉稳朱砂 #9E3B2E

       左一原参数（512 尺度，全部照搬、一个没改）：
         外圆角 32 · 内版框 inset 38 / 圆角 5 / 线宽 1.5 / opacity .55
         竖线：纵向 82→430，间距 48（x=160/208/256/304/352），中缝 9、丝栏 3.5
         鱼尾：宽 96（208→304）、高 43、中央 V 缺口深 18（= 高的 0.42，与 banxin.rs 同款）

       本版只改两处：
         ① 白口 51.5 → 139，鱼尾尺寸不动，上下各外移 43.75px（完全对称）
            上鱼尾 143.5→186.5，下鱼尾 325.5→368.5
            鱼尾组总跨 = 368.5 - 143.5 = 225，白口 139
            → 白口 / 鱼尾组总跨 = 139 / 225 = 0.6178  ≈ 黄金分割 0.618
            上下留白各 143.5，绝对居中
         ② 中间那条粗中缝（宽 9）在两鱼尾之间不画 —— 只留上下两段
            四条细丝栏仍贯通（保持左一「5 条线通到底」的观感），只有最粗的那条断开
  -->

  <!-- ① 纸底：圆角 32（左一原值，宋版版框的方正感） -->
  <rect x="0" y="0" width="512" height="512" rx="32" ry="32" fill="#F4ECD6"/>

  <!-- ② 四条细丝栏：贯通 82→430，与左一完全一致 -->
  <g fill="#2B2622">
    <rect x="158.25" y="82" width="3.5" height="348"/>
    <rect x="206.25" y="82" width="3.5" height="348"/>
    <rect x="302.25" y="82" width="3.5" height="348"/>
    <rect x="350.25" y="82" width="3.5" height="348"/>
  </g>

  <!-- ③ 粗中缝（宽 9）：拆成上下两段，中间 167→345 那段已删除
       ★ 线头收口：两段都在 y=167 / y=345 收住，正好缩进鱼尾 V 缺口的尖点
         （上鱼尾 V 尖在 168.5、下鱼尾在 343.5，V 斜边在 x=251.5 处为 170.2）
         → 线头被鱼尾完全吞掉，V 缺口里不再露出黑茬，鱼尾之间只剩纯米色 -->
  <g fill="#2B2622">
    <rect x="251.5" y="82"  width="9" height="85"/>
    <rect x="251.5" y="345" width="9" height="85"/>
  </g>

  <!-- ④ 上鱼尾：矩形 208→304 宽、143.5→186.5 高
       平顶实心块，底边自两端斜向中心凹进（V 深 18，两侧成两枚朝下的尖） -->
  <polygon points="208,143.5 304,143.5 304,186.5 256,168.5 208,186.5"
           fill="#9E3B2E"/>

  <!-- ⑤ 下鱼尾：上鱼尾的严格镜像，325.5→368.5 高，平底、顶边中心凹进 -->
  <polygon points="208,368.5 304,368.5 304,325.5 256,343.5 208,325.5"
           fill="#9E3B2E"/>

  <!-- ⑥ 内版框：左一原值（inset 38、圆角 5、1.5px、墨色 55%） -->
  <rect x="38" y="38" width="436" height="436" rx="5" ry="5"
        fill="none" stroke="#2B2622" stroke-width="1.5" opacity="0.55"/>
</svg>
