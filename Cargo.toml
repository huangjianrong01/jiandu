[workspace]
members = ["core"]

[package]
name = "jiandu"
version = "1.52.1"
edition = "2021"
description = "笺读 · 一个用 Rust + GPUI 写的原生中文阅读器（古文竖笺 / 现代横笺）"
license = "MIT"
authors = ["you"]

[[bin]]
name = "jiandu"
path = "src/main.rs"

[dependencies]
# GPUI：Zed 的 GPU 加速 UI 框架。
# 固定 crates.io 稳定版（0.2.2）——zed 的 main 分支 API 每天都在变，
# 跟随它会导致「昨天还能编译、今天报一堆错」；固定版本保证可复现构建。
gpui = "0.2.2"
# 纯逻辑核心（v1.47.0 解耦）：网格排版 / 解析器 / 字典查询在此，
# 零 GPUI 依赖，为移植 iOS 做准备。
jiandu-core = { path = "core" }
# 文本与结构
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# EPUB 导入（zip + opf 解析）
zip = "2"
quick-xml = "0.36"
# 编码探测：老书 txt 多为 GBK，读错码会整页方块（与浏览器同一套码表）
encoding_rs = "0.8"
# 简繁对照表
once_cell = "1"
# 原生文件选择器（导入 md/txt/epub/json）
rfd = "0.14"
# 导出分享：PNG 解码 + PDF 光栅嵌入（均取自离线缓存，可离线构建）。
# 只开 `png` feature，避免 image 默认拉进 jpeg/tiff 等未缓存的子依赖。
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
# 离线双引擎字典：《康熙字典》+《說文解字》合并库（见 `scripts/merge_dict.py`）。
# `bundled` = 自己编译一份 sqlite3 进二进制，不依赖系统库版本；数据文件由
# `include_bytes!` 嵌入，运行时零 I/O、断网可查。
rusqlite = { version = "0.32.1", features = ["bundled"] }

[profile.release]
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1
