# ─────────────────────────────────────────────────────────────────────────────
# 笺读 JianDu · Cargo Workspace（v1.0.0-beta 起）
#
# 为什么要拆成 workspace：
#   未来要上 Windows / iOS / Android，而现在的壳子是 GPUI（macOS 原生）。
#   把「书是什么、怎么排」与「用谁画」分开，跨平台时只换壳子、不动内核。
#
#   crates/core —— **纯 Rust 内核**，零 UI 依赖。EPUB 解析 / SQLite(FTS5)
#                  检索 / AI(RAG) / 数据模型 / 排版几何 / 注音判据全在这里。
#                  可被 Tauri 壳、iOS 壳、命令行工具直接复用，甚至编成 cdylib。
#   crates/app  —— 当前的 macOS 原生壳子（GPUI）。平台相关的一切（CoreGraphics
#                  PDF、NSPasteboard、NSSound、IME）只准出现在这里。
#
# 铁律：**core 里绝不能出现 `use gpui` / `use cocoa` / `use objc`**。
# 有 CI 级的 grep 校验（`scripts/check_core_purity.sh`）。
# ─────────────────────────────────────────────────────────────────────────────
[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

# 版本 / 元数据统一在一处，两个 crate 用 `version.workspace = true` 继承，
# 免得出现「core 1.47、app 1.0」这种对不上账的版本号。
[workspace.package]
version = "1.9.23"
edition = "2021"
license = "MIT"
authors = ["you"]

# 两个 crate 共用的依赖也统一版本。Cargo 的 workspace 继承只认**版本号**，
# 不认 feature，所以 feature 仍在各 crate 里写——这里负责「别出现两份
# rusqlite 各自编一份 bundled sqlite3」这种又慢又大的事故。
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
encoding_rs = "0.8"
once_cell = "1"
regex = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
pinyin = "0.11.0"

# 只有 workspace 根的 profile 生效（member 里写会被忽略并告警）。
[profile.release]
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1
