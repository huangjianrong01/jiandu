[package]
name = "jiandu"
version = "0.9.0"
edition = "2021"
description = "笺读 · 一个用 Rust + GPUI 写的原生中文阅读器（古文竖笺 / 现代横笺）"
license = "MIT"
authors = ["you"]

[[bin]]
name = "jiandu"
path = "src/main.rs"

[dependencies]
# GPUI：Zed 的 GPU 加速 UI 框架。
# 固定 crates.io 稳定版（0.2.2）——zed 的 main 分支 API 每天都在变，
# 跟随它会导致「昨天还能编译、今天报一堆错」；固定版本保证可复现构建。
gpui = "0.2.2"
# 文本与结构
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# EPUB 导入（zip + opf 解析）
zip = "2"
quick-xml = "0.36"
# 简繁对照表
once_cell = "1"
# 原生文件选择器（导入 md/txt/epub/json）
rfd = "0.14"

[profile.release]
lto = "thin"
opt-level = 3

[profile.dev]
opt-level = 1
