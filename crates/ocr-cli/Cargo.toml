[package]
name = "jiandu-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jiandu-ocr"
path = "src/main.rs"

# 离线预处理 CLI：扫描图 → JSON（V2.0 影印对照 L4 对齐契约的 seed）。
# 注意：本 crate 不属于 crates/core，使用 `image` 不违反 core 纯洁红线。
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
# L4 真实引擎：macOS 原生 Vision FFI（零模型、离线、走 Neural Engine）。
# 只在 ocr-cli（独立 crate）里接，绝不进 jiandu-core（core 纯洁红线）。
jiandu-core = { path = "../core" }
objc2 = { version = "0.5", features = ["std"] }
objc2-foundation = { version = "0.2", features = ["all"] }
objc2-vision = "0.2"
# L5 落库：SQLite 持久化（纯 Rust 绑定；dev 验证用系统 lib，生产可加 features=["bundled"] 自带源码）
rusqlite = "0.32"
