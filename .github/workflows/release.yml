name: Build Windows Installer

# 触发条件：
#   1. 推送到 main 分支 → 仅构建并上传 Artifact（.msi / .exe）
#   2. 推送到 feature/windows-port 分支 → 同上（Windows 移植开发分支）
#   3. 推送形如 v* 的 tag（如 v1.0.0）→ 构建并把安装包发布到 GitHub Release
#   4. 手动在 Actions 页面点 "Run workflow" 触发
on:
  push:
    branches: [main, feature/windows-port]
    tags: ["v*"]
  workflow_dispatch:

# 发布 Release 时需要写权限（仅 tag 触发那一步用到；Artifact 上传用默认 token 即可）
permissions:
  contents: write

jobs:
  windows-build:
    name: Build Windows installer (.msi / .exe)
    runs-on: windows-latest
    # Tauri 工程在仓库子目录 jiandu-tauri/，其 Rust 端在 jiandu-tauri/src-tauri/，
    # 且通过相对路径 ../../crates/core 引用主仓库的纯 Rust 内核（jiandu-core）。
    # 因此所有 cargo / tauri 命令都从 jiandu-tauri/ 目录执行（Tauri CLI 默认找 ./src-tauri）。
    defaults:
      run:
        working-directory: jiandu-tauri

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          # windows-latest 自带 MSVC 链接器（Visual Studio Build Tools），
          # 这里显式装上 windows-msvc 标准库，确保 rusqlite 的 bundled SQLite
          # 能用 MSVC 工具链原生编译。
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存作用域锁定到 Tauri 的 Rust 工程，避免与主仓库 workspace 混淆
          workspaces: jiandu-tauri/src-tauri

      - name: Install frontend deps (Tauri CLI)
        # package.json 已声明 @tauri-apps/cli (^2)，npm install 后直接用 npx tauri build。
        # 比 `cargo install tauri-cli` 省去 CLI 自身从源码编译的 5~10 分钟，且不易碎。
        run: npm install

      - name: Build and bundle (npx tauri build)
        # 产物：src-tauri/target/release/bundle/msi/*.msi 与 bundle/nsis/*.exe
        # 注意：Tauri 安装包只能在 Windows 上构建（WiX / NSIS 仅 Windows 可用），
        # 这就是当初在 macOS 交叉编译只会产出「假空包」的根本原因——本流水线
        # 交给 windows-latest 真机出包，从根上规避。
        run: npx tauri build

      - name: Verify installer is NOT empty (root-cause fix for hollow MSI)
        # 之前 4.78MB 假空包的根因：GPUI 在 Windows 编不过 → 没有真 jiandu-tauri.exe
        # → WiX 只能打包出仅含元数据/引导的空壳。
        # 现在走 Tauri，且本步骤强制校验 MSI 的 File 表里确实嵌入了 jiandu-tauri.exe，
        # 任何「编不出真二进制」的情况都会在此处直接 RED，杜绝再次产出空包。
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $msi = Get-ChildItem jiandu-tauri/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "MSI 未生成，构建可能失败"; exit 1 }

          $sizeMB = [math]::Round($msi.Length / 1MB, 2)
          Write-Host "MSI: $($msi.Name)  size=${sizeMB}MB"
          # 真安装包（含应用二进制 + WebView2 引导）必然远大于当年的 4.78MB 空壳
          if ($msi.Length -lt 6MB) { Write-Error "MSI 仅 ${sizeMB}MB，疑似空包（应 > 6MB）"; exit 1 }

          # 用 Windows Installer COM 打开 MSI，枚举 File 表，确认真的嵌有应用 exe
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.OpenDatabase($msi.FullName, 0)
          $view = $db.OpenView("SELECT FileName FROM File")
          $view.Execute()
          $found = $false
          while ($null -ne ($rec = $view.Fetch())) {
            if ($rec.StringData(1) -like "*jiandu-tauri.exe*") { $found = $true; break }
          }
          if (-not $found) { Write-Error "MSI 的 File 表中未找到 jiandu-tauri.exe —— 空包！"; exit 1 }
          Write-Host "OK: 真 MSI，已嵌入 jiandu-tauri.exe"

          $exe = Get-ChildItem jiandu-tauri/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "NSIS 安装包未生成"; exit 1 }
          Write-Host "NSIS exe: $($exe.Name)  size=$([math]::Round($exe.Length/1MB,2))MB"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jiandu-windows-installer
          # Artifact 路径相对仓库根（不受 working-directory 影响）
          path: |
            jiandu-tauri/src-tauri/target/release/bundle/msi/*.msi
            jiandu-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: jiandu ${{ github.ref_name }}
          body: |
            笺读 Windows 桌面安装包（自动构建）

            - Windows 10 (1803 及以上) / Windows 11 适用
            - 老旧系统（Windows 7/8 等）请改用「云端代排服务」
          files: |
            jiandu-tauri/src-tauri/target/release/bundle/msi/*.msi
            jiandu-tauri/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
