<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笺读 · 配色方案预览（对应 09 图样式面板）</title>
<style>
  :root { font-family: "Songti SC","STSong","SimSun",serif; }
  body { margin:0; background:#2b2620; color:#e9e2d2; padding:28px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:2px; margin:0 0 4px; }
  p.sub { margin:0 0 22px; color:#a8957a; font-size:13px; }
  .grid { display:flex; flex-wrap:wrap; gap:18px; }
  .card { width:300px; border-radius:6px; padding:18px; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .pname { font-size:15px; letter-spacing:3px; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,.12); padding-bottom:8px; }
  .row { display:flex; align-items:baseline; gap:10px; margin:9px 0; }
  .lbl { width:62px; font-size:11px; opacity:.65; flex-shrink:0; }
  .sample { font-size:19px; line-height:1.5; }
  .note-sm { font-size:13px; }
  .swatches { display:flex; gap:6px; margin-top:14px; }
  .sw { width:26px; height:26px; border-radius:4px; border:1px solid rgba(255,255,255,.2); }
  .foot { margin-top:24px; font-size:12px; color:#a8957a; }
  code { background:rgba(255,255,255,.08); padding:1px 5px; border-radius:3px; }
</style>
</head>
<body>
  <h1>笺读 · 配色方案预览</h1>
  <p class="sub">对应 09 图样式面板里的成对色块：前者为正文，后者为小字注释。通假（借字）统一用靛蓝。深底（夜读）已自动提亮。</p>
  <div class="grid" id="grid"></div>
  <div class="foot">
    预览基于 <code>src/theme.rs</code> 的 <code>InkPalette</code> 实际取色（宣纸浅底）。松墨套即为 09 图所选：正文深墨绿、注文砖红。<br>
    在 App 内：「样式」面板 → 点「配色」一行中的色块即可实时切换。
  </div>

<script>
  // 数据取自 theme.rs InkPalette（light = 浅底, dark = 夜读提亮）
  const P = [
    { name:"墨朱", ink:0x2A241E, note:0xA33B2B, gloss:0x3E5A8A, inkD:0xDCCFB8, noteD:0xD08163, glossD:0x8FA8D0 },
    { name:"松墨", ink:0x24402F, note:0xA8442E, gloss:0x3E5A8A, inkD:0xBCD3B6, noteD:0xD08163, glossD:0x8FA8D0 },
    { name:"赭朱", ink:0x4A3520, note:0xB23A2E, gloss:0x3E5A8A, inkD:0xD9C2A2, noteD:0xD08163, glossD:0x8FA8D0 },
    { name:"靛青", ink:0x233A52, note:0x3E5A8A, gloss:0x3E5A8A, inkD:0xC2D2E6, noteD:0x8FA8D0, glossD:0x8FA8D0 },
    { name:"紫棠", ink:0x3E2A46, note:0xB0417A, gloss:0x3E5A8A, inkD:0xDAC2E0, noteD:0xD08AB0, glossD:0x8FA8D0 },
  ];
  const hex = n => "#" + n.toString(16).padStart(6,"0");
  const paper = "#F2EAD6"; // 宣纸浅底
  const grid = document.getElementById("grid");
  for (const p of P) {
    const ink = hex(p.ink), note = hex(p.note), gloss = hex(p.gloss);
    const c = document.createElement("div");
    c.className = "card";
    c.style.background = paper;
    c.style.color = ink;
    c.innerHTML = `
      <div class="pname" style="color:${ink}">${p.name}</div>
      <div class="row"><span class="lbl" style="color:${note}">正文</span>
        <span class="sample" style="color:${ink}">关关雎鸠，在河之洲。窈窕淑女，君子好逑。</span></div>
      <div class="row"><span class="lbl" style="color:${note}">小字注释</span>
        <span class="sample note-sm" style="color:${note}">〔传〕雎鸠，王雎也，鸟挚而有别。</span></div>
      <div class="row"><span class="lbl" style="color:${gloss}">通假</span>
        <span class="sample note-sm" style="color:${gloss}">「说」通「悦」，熹皮反。</span></div>
      <div class="swatches">
        <div class="sw" style="background:${ink}" title="正文"></div>
        <div class="sw" style="background:${note}" title="小字注释"></div>
        <div class="sw" style="background:${gloss}" title="通假"></div>
      </div>`;
    grid.appendChild(c);
  }
</script>
</body>
</html>
