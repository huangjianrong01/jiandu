<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>笺读 · 鱼尾纹样张</title>
<style>
  :root { --paper:#F7F1E3; --ink:#2B2622; --accent:#A63A2B; --rule:#B98A63; }
  body { margin:0; padding:40px; background:#EAE0C9; color:var(--ink);
         font-family:"Songti SC","Noto Serif CJK SC",serif; }
  h1 { font-size:18px; letter-spacing:.3em; color:var(--accent); font-weight:500; margin:0 0 6px; }
  p  { font-size:12px; color:#8A8175; margin:0 0 28px; }
  .row { display:flex; gap:48px; align-items:flex-end; margin-bottom:36px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cap { font-size:11px; color:#8A8175; letter-spacing:.1em; }
  .strip {
    width:120px; height:340px; background:var(--paper);
    border:1px solid var(--rule); border-radius:3px;
    display:flex; flex-direction:column; align-items:center; padding:8px 0;
    box-sizing:border-box;
  }
  .strip .title { writing-mode:vertical-rl; font-size:22px; letter-spacing:.25em; flex:1; padding-top:10px; }
  svg { display:block; }
  .note { font-size:11.5px; color:#8A8175; line-height:1.7; }
  code { background:#F1E8D6; padding:1px 5px; border-radius:3px; font-size:11px; }
</style>
</head>
<body>
  <h1>魚 尾 紋</h1>
  <p>竹简条两端的鱼尾纹：上端朝下、下端朝上，正中一道窄缝分叉（viewBox 24×13）。</p>

  <div class="row">
    <div class="cell">
      <svg width="240" height="130" viewBox="0 0 24 13">
        <path d="M0,0 L11,0 L12,13 Z M24,0 L13,0 L12,13 Z" fill="#1A150F"/>
      </svg>
      <div class="cap">上尾 · 朝下</div>
    </div>
    <div class="cell">
      <svg width="240" height="130" viewBox="0 0 24 13">
        <path d="M0,13 L11,13 L12,0 Z M24,13 L13,13 L12,0 Z" fill="#1A150F"/>
      </svg>
      <div class="cap">下尾 · 朝上</div>
    </div>

    <div class="cell">
      <div class="strip">
        <svg width="101" height="55" viewBox="0 0 24 13">
          <path d="M0,0 L11,0 L12,13 Z M24,0 L13,0 L12,13 Z" fill="#1A150F"/>
        </svg>
        <div class="title">道德經</div>
        <svg width="101" height="55" viewBox="0 0 24 13">
          <path d="M0,13 L11,13 L12,0 Z M24,13 L13,13 L12,0 Z" fill="#1A150F"/>
        </svg>
      </div>
      <div class="cap">竹简条成品（含章名）</div>
    </div>
  </div>

  <p class="note">
    实现位置：<code>src/app.rs::ensure_assets()</code> 写盘 → <code>src/reader.rs::fish_tail()</code> 以 <code>svg().path(...)</code> 加载；<br>
    VM 内 SVG 颜色由元素 <code>text_color</code> 决定（本稿用 <code>#1A150F</code> 近黑）。若需更细的缝或更宽的叉，调 <code>L11/L13</code> 与 <code>L12,13</code> 的坐标即可。
  </p>
</body>
</html>
